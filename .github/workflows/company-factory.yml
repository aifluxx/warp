# Fork check for the company factory page.
# Warp CI in ci.yml runs only when github.repository_owner is warpdotdev,
# so this file is the check for aifluxx/warp. It does not deploy, read
# secrets, or start the release workflows.

name: Company factory

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - crates/company_factory/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/company-factory.yml

permissions:
  contents: read

concurrency:
  group: company-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false && github.repository == 'aifluxx/warp'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.92.0"
          components: clippy, rustfmt

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config

      - name: Format
        run: cargo fmt -p company_factory -- --check

      - name: Clippy
        run: cargo clippy -p company_factory --all-targets --tests --locked -- -D warnings

      - name: Test
        run: cargo test -p company_factory --locked
